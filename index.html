<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cute Wordle 🐱</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:sans-serif;background:linear-gradient(135deg,#ffc2d1,#caf0f8);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:10px}
.game{width:100%;max-width:340px;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 8px 25px rgba(255,105,180,0.3)}
.header{background:linear-gradient(90deg,#ff8fab,#8ec5fc);padding:12px;text-align:center;color:#fff;font-size:18px;font-weight:bold}
.picture{background:#f0f0f0;padding:15px;text-align:center}
.picture svg{width:80px;height:80px}
.picture p{color:#888;font-size:12px;margin-top:5px}
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:15px;justify-items:center}
.tile{width:50px;height:50px;border:2px solid #ddd;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:bold;background:#fff}
.tile.filled{border-color:#ff8fab}
.tile.green{background:#4ade80;border-color:#4ade80;color:#fff}
.tile.yellow{background:#facc15;border-color:#facc15}
.tile.gray{background:#ccc;border-color:#ccc;color:#fff}
.message{padding:10px;text-align:center;font-size:14px;font-weight:bold;min-height:40px;color:#333}
.buttons{padding:5px 10px;display:flex;justify-content:center;gap:10px}
.buttons button{padding:8px 20px;background:#ff8fab;border:none;border-radius:15px;color:#fff;font-weight:bold;cursor:pointer;font-size:13px}
.keyboard{display:flex;flex-wrap:wrap;gap:4px;padding:10px;background:#eee;justify-content:center}
.key{width:30px;height:40px;background:#fff;border:1px solid #bbb;border-radius:5px;font-size:14px;font-weight:bold;color:#333;cursor:pointer}
.key:active{background:#ff8fab;color:#fff}
.key.green{background:#4ade80;color:#fff;border-color:#4ade80}
.key.yellow{background:#facc15;color:#333;border-color:#facc15}
.key.gray{background:#ccc;color:#fff;border-color:#ccc}
.key.enter{width:50px}
.key.back{width:50px}
</style>
</head>
<body>
<div class="game">
<div class="header">🐱 Cute Wordle 🐱</div>
<div class="picture" id="picture"></div>
<div class="message" id="message">Guess the animal!</div>
<div class="buttons">
<button onclick="newGame()">🎲 New</button>
<button onclick="useHint()">💡 Hint</button>
</div>
<div class="board" id="board"></div>
<div class="keyboard" id="keyboard"></div>
</div>

<script>
const levels=[
{w:'CAT',svg:'<svg viewBox="0 0 100 100"><ellipse cx="50" cy="55" rx="25" ry="30" fill="#ffb6c1"/><polygon points="30,30 20,50 38,45" fill="#ffb6c1"/><polygon points="70,30 80,50 62,45" fill="#ffb6c1"/><circle cx="40" cy="52" r="4" fill="#333"/><circle cx="60" cy="52" r="4" fill="#333"/></svg>'},
{w:'DOG',svg:'<svg viewBox="0 0 100 100"><ellipse cx="50" cy="55" rx="30" ry="25" fill="#d4a574"/><polygon points="25,40 15,55 35,50" fill="#d4a574"/><polygon points="75,40 85,55 65,50" fill="#d4a574"/><circle cx="40" cy="52" r="4" fill="#333"/><circle cx="60" cy="52" r="4" fill="#333"/></svg>'},
{w:'SUN',svg:'<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="20" fill="#fbbf24"/><line x1="50" y1="15" x2="50" y2="5" stroke="#fbbf24" stroke-width="4"/><line x1="50" y1="85" x2="50" y2="95" stroke="#fbbf24" stroke-width="4"/><line x1="15" y1="50" x2="5" y2="50" stroke="#fbbf24" stroke-width="4"/><line x1="85" y1="50" x2="95" y2="50" stroke="#fbbf24" stroke-width="4"/></svg>'},
{w:'FISH',svg:'<svg viewBox="0 0 100 100"><ellipse cx="55" cy="50" rx="25" ry="15" fill="#f87171"/><polygon points="30,50 15,38 15,62" fill="#f87171"/><circle cx="65" cy="48" r="3" fill="#333"/></svg>'},
{w:'BEE',svg:'<svg viewBox="0 0 100 100"><ellipse cx="50" cy="50" rx="25" ry="15" fill="#fbbf24"/><line x1="35" y1="42" x2="35" y2="58" stroke="#333" stroke-width="2"/><line x1="50" y1="42" x2="50" y2="58" stroke="#333" stroke-width="2"/><line x1="65" y1="42" x2="65" y2="58" stroke="#333" stroke-width="2"/><circle cx="40" cy="50" r="3" fill="#333"/></svg>'},
{w:'BEAR',svg:'<svg viewBox="0 0 100 100"><ellipse cx="50" cy="58" rx="28" ry="22" fill="#92400e"/><circle cx="35" cy="38" r="8" fill="#92400e"/><circle cx="65" cy="38" r="8" fill="#92400e"/><circle cx="35" cy="38" r="5" fill="#fef3c7"/><circle cx="65" cy="38" r="5" fill="#fef3c7"/></svg>'}
];

let game={target:null,current:'',row:0,over:false,usedHint:false};

function playSound(freq,dur,vol){
try{
let ctx=new(window.AudioContext||window.webkitAudioContext)();
let osc=ctx.createOscillator();
let gain=ctx.createGain();
osc.type='sine';
osc.frequency.value=freq;
gain.gain.value=vol;
gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+dur);
osc.connect(gain);
gain.connect(ctx.destination);
osc.start();
osc.stop(ctx.currentTime+dur);
}catch(e){}
}

function newGame(){
game.target=levels[Math.floor(Math.random()*levels.length)];
game.current='';
game.row=0;
game.over=false;
game.usedHint=false;
document.getElementById('picture').innerHTML=game.target.svg+'<p>What animal?</p>';
document.getElementById('message').textContent='Guess the animal!';
document.getElementById('message').style.color='#333';
makeBoard();
makeKeyboard();
playSound(600,0.1,0.1);
}

function makeBoard(){
let board=document.getElementById('board');
board.innerHTML='';
for(let i=0;i<30;i++){
let tile=document.createElement('div');
tile.className='tile';
tile.id='tile'+i;
board.appendChild(tile);
}
}

function makeKeyboard(){
let kb=document.getElementById('keyboard');
kb.innerHTML='';
let rows=['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'];
rows.forEach((r,i)=>{
r.split('').forEach(l=>{
let btn=document.createElement('button');
btn.className='key';
btn.textContent=l;
btn.onclick=function(){typeKey(l)};
kb.appendChild(btn);
});
if(i===0){
let ent=document.createElement('button');
ent.className='key enter';
ent.textContent='ENTER';
ent.onclick=submit;
kb.appendChild(ent);
}
if(i===1){
let del=document.createElement('button');
del.className='key back';
del.textContent='⌫';
del.onclick=deleteKey;
kb.appendChild(del);
}
});
}

function typeKey(letter){
if(game.over||game.current.length>=5)return;
game.current+=letter;
playSound(600,0.05,0.08);
updateTiles();
}

function deleteKey(){
if(game.over||game.current.length===0)return;
game.current=game.current.slice(0,-1);
playSound(400,0.05,0.08);
updateTiles();
}

function updateTiles(){
for(let i=0;i<5;i++){
let tile=document.getElementById('tile'+(game.row*5+i));
tile.textContent=game.current[i]||'';
tile.className='tile'+(game.current[i]?' filled':'');
}
}

function submit(){
if(game.over||game.current.length!==5)return;
let guess=game.current;
let target=game.target.w;
let result=[];
for(let i=0;i<5;i++){
if(guess[i]===target[i])result[i]='green';
else if(target.includes(guess[i]))result[i]='yellow';
else result[i]='gray';
}
for(let i=0;i<5;i++){
let tile=document.getElementById('tile'+(game.row*5+i));
let key=document.querySelector('.key[textContent="'+guess[i]+'"]');
setTimeout(()=>{
tile.className='tile '+result[i];
if(result[i]==='green')playSound(800,0.15,0.15);
else if(result[i]==='yellow')playSound(500,0.15,0.12);
else playSound(200,0.2,0.12);
if(key)key.className='key '+result[i];
},i*150);
}
setTimeout(()=>{
if(guess===target){
game.over=true;
playSound(523,0.12,0.15);setTimeout(()=>playSound(659,0.12,0.15),100);setTimeout(()=>playSound(784,0.12,0.15),200);
document.getElementById('message').textContent='🎉 Correct! It was '+target+'!';
document.getElementById('message').style.color='#4ade80';
}else{
game.row++;
if(game.row>=6){
game.over=true;
playSound(300,0.3,0.15);setTimeout(()=>playSound(200,0.4,0.15),300);
document.getElementById('message').textContent='😢 Answer: '+target;
document.getElementById('message').style.color='#f87171';
}else{
game.current='';
}
}
},800);
}

function useHint(){
if(game.usedHint||game.over)return;
game.usedHint=true;
document.getElementById('message').textContent='Hint: Starts with '+game.target.w[0];
playSound(800,0.15,0.15);
}

document.addEventListener('keydown',function(e){
if(e.key==='Enter')submit();
else if(e.key==='Backspace')deleteKey();
else if(/^[a-zA-Z]$/.test(e.key))typeKey(e.key.toUpperCase());
});

newGame();
</script>
</div>
</body>
</html>
