<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Cute Wordle 🐱</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Comic Sans MS',cursive;background:linear-gradient(135deg,#ffe4ec,#e8f4f8);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:10px}
.app{width:100%;max-width:380px;background:#fff;border-radius:25px;overflow:hidden;box-shadow:0 10px 40px rgba(255,182,193,0.5)}
.hd{background:linear-gradient(90deg,#ffb6c1,#87ceeb);padding:12px;text-align:center}
.hd h1{color:#fff;font-size:22px;text-shadow:2px 2px 4px rgba(0,0,0,0.2)}
.hint-box{background:#f8f8f8;padding:10px;text-align:center;border-bottom:3px dashed #ffb6c1}
.hint-img{width:100px;height:100px;margin:8px auto}
.hint-text{color:#888;font-size:13px}
.grd{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:12px;justify-items:center}
.tile{width:52px;height:52px;border:3px solid #e0e0e0;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#fff;transition:all 0.3s}
.tile.correct{background:#51cf66;border-color:#51cf66;animation:bounce 0.4s}
.tile.wrong{background:#ff6b6b;border-color:#ff6b6b;animation:shake 0.4s}
.tile.close{background:#ffd43b;border-color:#ffd43b}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.msg{padding:10px;text-align:center;font-size:16px;font-weight:bold;min-height:40px}
.msg.win{color:#51cf66;animation:pop 0.5s}
.msg.lose{color:#ff6b6b}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.btns{padding:8px;text-align:center}
.btn{padding:10px 25px;background:linear-gradient(90deg,#ffb6c1,#87ceeb);border:none;border-radius:20px;color:#fff;font-size:14px;font-weight:bold;cursor:pointer;margin:4px}
.kb{background:#f0f0f0;padding:10px;display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.key{min-width:35px;height:42px;padding:0 8px;background:#fff;border:2px solid #ddd;border-radius:8px;font-size:14px;font-weight:bold;color:#555;cursor:pointer}
.key:active{transform:scale(0.95);background:#ffb6c1;border-color:#ffb6c1;color:#fff}
.key.correct{background:#51cf66;border-color:#51cf66;color:#fff}
.key.wrong{background:#ff6b6b;border-color:#ff6b6b;color:#fff}
</style>
</head>
<body>
<div class="app">
<div class="hd"><h1>🐱 Cute Wordle 🐱</h1></div>
<div class="hint-box"><div class="hint-img" id="hintImg"></div><div class="hint-text">What animal?</div></div>
<div class="grd" id="grid"></div>
<div class="msg" id="msg">Type the word!</div>
<div class="btns"><button class="btn" onclick="newGame()">🎲 New</button><button class="btn" onclick="showHint()">💡 Hint</button></div>
<div class="kb" id="keyboard"></div>
</div>
<script>
const D={words:[{w:'CAT',svg:'<svg viewBox="0 0 100 100"><ellipse cx="50" cy="55" rx="30" ry="35" fill="#ffb6c1"/><polygon points="25,25 35,45 20,40" fill="#ffb6c1"/><polygon points="75,25 65,45 80,40" fill="#ffb6c1"/><circle cx="38" cy="50" r="5" fill="#333"/><circle cx="62" cy="50" r="5" fill="#333"/><ellipse cx="50" cy="58" rx="3" ry="2" fill="#ff6b6b"/></svg>'},{w:'DOG',svg:'<svg viewBox="0 0 100 100"><ellipse cx="50" cy="55" rx="35" ry="30" fill="#d4a574"/><polygon points="20,30 10,50 30,45" fill="#d4a574"/><polygon points="80,30 90,50 70,45" fill="#d4a574"/><circle cx="38" cy="50" r="6" fill="#333"/><circle cx="62" cy="50" r="6" fill="#333"/><ellipse cx="50" cy="58" rx="4" ry="3" fill="#333"/></svg>'},{w:'SUN',svg:'<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="25" fill="#ffd700"/><line x1="50" y1="10" x2="50" y2="5" stroke="#ffd700" stroke-width="5"/><line x1="50" y1="90" x2="50" y2="95" stroke="#ffd700" stroke-width="5"/><line x1="10" y1="50" x2="5" y2="50" stroke="#ffd700" stroke-width="5"/><line x1="90" y1="50" x2="95" y2="50" stroke="#ffd700" stroke-width="5"/></svg>'},{w:'MOON',svg:'<svg viewBox="0 0 100 100"><path d="M50 10 A40 40 0 1 1 50 90 A30 30 0 1 0 50 10" fill="#ffd700"/><circle cx="30" cy="35" r="3" fill="#fff"/></svg>'},{w:'FISH',svg:'<svg viewBox="0 0 100 100"><ellipse cx="55" cy="50" rx="30" ry="18" fill="#ff7f7f"/><polygon points="25,50 10,35 10,65" fill="#ff7f7f"/><circle cx="65" cy="45" r="4" fill="#333"/></svg>'},{w:'BIRD',svg:'<svg viewBox="0 0 100 100"><ellipse cx="55" cy="50" rx="25" ry="15" fill="#87ceeb"/><polygon points="80,50 95,40 95,60" fill="#87ceeb"/><circle cx="40" cy="47" r="3" fill="#333"/></svg>'},{w:'BEAR',svg:'<svg viewBox="0 0 100 100"><ellipse cx="50" cy="60" rx="35" ry="30" fill="#8b4513"/><circle cx="35" cy="35" r="12" fill="#8b4513"/><circle cx="65" cy="35" r="12" fill="#8b4513"/><circle cx="35" cy="35" r="8" fill="#deb887"/><circle cx="65" cy="35" r="8" fill="#deb887"/></svg>'},{w:'BEE',svg:'<svg viewBox="0 0 100 100"><ellipse cx="50" cy="55" rx="30" ry="20" fill="#ffd700"/><line x1="30" y1="45" x2="30" y2="65" stroke="#333" stroke-width="2"/><line x1="50" y1="45" x2="50" y2="65" stroke="#333" stroke-width="2"/><line x1="70" y1="45" x2="70" y2="65" stroke="#333" stroke-width="2"/><circle cx="40" cy="50" r="4" fill="#333"/></svg>'}]};
let G={target:null,cur:'',att:0,max:6,over:false,hinted:false};
const S={ctx:null,init(){if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)()},p(f,d,v=0.15){if(!this.ctx)return;let o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(v,this.ctx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,this.ctx.currentTime+d);o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+d)},type(){this.p(600,0.05,0.1)},right(){this.p(800,0.15);setTimeout(()=>this.p(1000,0.2),100)},wrong(){this.p(300,0.2,0.2)},win(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>this.p(f,0.2),i*100))},lose(){[400,300,200].forEach((f,i)=>setTimeout(()=>this.p(f,0.3,0.15),i*200))}};
function newGame(){S.init();G.target=D.words[Math.floor(Math.random()*D.words.length)];G.cur='';G.att=0;G.over=false;G.hinted=false;document.getElementById('msg').innerText='Type!';document.getElementById('msg').className='msg';document.getElementById('hintImg').innerHTML=G.target.svg;renderGrid();renderKB()}
function renderGrid(){const g=document.getElementById('grid');g.innerHTML='';for(let i=0;i<30;i++){let t=document.createElement('div');t.className='tile';t.id='tile-'+i;g.appendChild(t)}}
function renderKB(){const k=document.getElementById('keyboard');k.innerHTML='';['QWERTYUIOP','ASDFGHJKL','ZXCVBNM'].forEach((r,ri)=>{if(ri==2){let e=document.createElement('button');e.className='key';e.innerText='ENTER';e.style.minWidth='55px';e.onclick=()=>submit();k.appendChild(e)}r.split('').forEach(l=>{let b=document.createElement('button');b.className='key';b.innerText=l;b.id='k-'+l;b.onclick=()=>type(l);k.appendChild(b)});if(ri==2){let d=document.createElement('button');d.className='key';d.innerText='⌫';d.style.minWidth='55px';d.onclick=()=>del();k.appendChild(d)}})}
function type(l){if(G.over||G.cur.length>=5)return;G.cur+=l;S.type();upd()}
function del(){if(G.over||G.cur.length==0)return;G.cur=G.cur.slice(0,-1);S.type();upd()}
function upd(){for(let i=0;i<5;i++){let t=document.getElementById('tile-'+(G.att*5+i));t.innerText=G.cur[i]||'';t.style.borderColor=G.cur[i]?'#ffb6c1':'#e0e0e0'}}
function submit(){if(G.over||G.cur.length!=5)return;let w=G.cur,t=G.target.w,res=[];for(let i=0;i<5;i++){if(w[i]==t[i])res[i]='correct';else if(t.includes(w[i]))res[i]='close';else res[i]='wrong'}for(let i=0;i<5;i++){let tile=document.getElementById('tile-'+(G.att*5+i)),k=document.getElementById('k-'+w[i]);tile.className='tile '+res[i];if(res[i]=='correct')S.right();else if(res[i]=='wrong')S.wrong();if(k)k.classList.add(res[i])}if(w==t){G.over=true;S.win();document.getElementById('msg').innerText='🎉 You Won!';document.getElementById('msg').className='msg win'}else{G.att++;if(G.att>=G.max){G.over=true;S.lose();document.getElementById('msg').innerText='😞 Answer: '+t;document.getElementById('msg').className='msg lose'}else{G.cur=''}}
function showHint(){if(G.hinted||G.over)return;G.hinted=true;document.getElementById('hintImg').innerHTML=G.target.svg;S.right()}
document.addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey)return;if(e.key=='Enter')submit();else if(e.key=='Backspace')del();else if(/^[A-Z]$/.test(e.key))type(e.key)});
newGame();
</script>
</div>
</body>
</html>
