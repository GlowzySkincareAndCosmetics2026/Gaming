<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch the Stars ⭐</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            font-family: Arial, sans-serif;
            overflow: hidden;
            touch-action: none;
        }

        .game-container {
            position: relative;
            width: 350px;
            height: 450px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .score-board {
            position: absolute;
            top: 10px;
            left: 15px;
            color: white;
            font-size: 18px;
            z-index: 10;
            text-shadow: 0 0 5px black;
        }

        .score-board span {
            color: #ffd700;
            font-weight: bold;
            font-size: 22px;
        }

        .lives {
            position: absolute;
            top: 12px;
            right: 15px;
            font-size: 20px;
        }

        .player {
            position: absolute;
            font-size: 42px;
            bottom: 25px;
            left: 154px;
            transition: left 0.08s linear;
            filter: drop-shadow(0 0 15px gold);
            z-index: 5;
        }

        .item {
            position: absolute;
            font-size: 32px;
            top: -40px;
            z-index: 4;
        }

        .start-screen, .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 50;
            text-align: center;
        }

        .hidden { display: none !important; }

        h1 {
            font-size: 28px;
            margin: 10px 0;
            background: linear-gradient(90deg, #ffd700, #ff6b6b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn {
            padding: 12px 35px;
            font-size: 18px;
            background: linear-gradient(90deg, #ffd700, #ffaa00);
            border: none;
            border-radius: 25px;
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .btn:active { transform: scale(0.95); }

        .final-score {
            font-size: 50px;
            color: #ffd700;
            margin: 10px 0;
        }

        /* Movement Buttons */
        .controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 20;
        }

        .control-btn {
            width: 70px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 15px;
            font-size: 28px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .control-btn:active {
            background: rgba(255, 215, 0, 0.5);
            transform: scale(0.95);
        }

        /* Stars background */
        .bg-star {
            position: absolute;
            color: white;
            opacity: 0.4;
            font-size: 12px;
            animation: twinkle 1.5s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.7; }
        }

        .instructions {
            font-size: 14px;
            color: #ccc;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="game-container" id="gameContainer" tabindex="0">
    <div class="score-board">Score: <span id="score">0</span></div>
    <div class="lives" id="lives">❤️❤️❤️</div>
    
    <div class="player" id="player">🦸</div>
    
    <!-- Start Screen -->
    <div class="start-screen" id="startScreen">
        <h1>⭐ Catch the Stars</h1>
        <p style="color:#aaa;margin:5px;">Catch good items, avoid bad ones!</p>
        <div style="font-size:30px;margin:10px;">⭐💎🌟 vs 💀💣🦴</div>
        <button class="btn" onclick="startGame()">PLAY ▶️</button>
        <p class="instructions">Use ← → arrows or buttons below</p>
    </div>
    
    <!-- Game Over Screen -->
    <div class="game-over-screen hidden" id="gameOverScreen">
        <h1>Game Over!</h1>
        <p style="color:#aaa;">Final Score:</p>
        <div class="final-score" id="finalScore">0</div>
        <button class="btn" onclick="startGame()">PLAY AGAIN 🔄</button>
    </div>

    <!-- On-screen controls -->
    <div class="controls" id="controls">
        <div class="control-btn" ontouchstart="moveLeft()" onmousedown="moveLeft()">⬅️</div>
        <div class="control-btn" ontouchstart="moveRight()" onmousedown="moveRight()">➡️</div>
    </div>
</div>

<script>
    const player = document.getElementById('player');
    const scoreDisplay = document.getElementById('score');
    const livesDisplay = document.getElementById('lives');
    const gameContainer = document.getElementById('gameContainer');
    const startScreen = document.getElementById('startScreen');
    const gameOverScreen = document.getElementById('gameOverScreen');
    const finalScoreDisplay = document.getElementById('finalScore');
    const controlsDiv = document.getElementById('controls');

    let score = 0;
    let lives = 3;
    let playerX = 154;
    let gameRunning = false;
    let moveSpeed = 25;
    let keys = {};

    // Items: emoji + points
    const goodItems = ['⭐', '💎', '🌟', '🔮', '🍀'];
    const badItems = ['💀', '💣', '🦴', '👻'];

    // Create background stars
    for (let i = 0; i < 25; i++) {
        const star = document.createElement('div');
        star.className = 'bg-star';
        star.textContent = '✦';
        star.style.left = Math.random() * 340 + 'px';
        star.style.top = Math.random() * 440 + 'px';
        star.style.animationDelay = Math.random() * 1.5 + 's';
        gameContainer.appendChild(star);
    }

    // Hide controls initially
    controlsDiv.classList.add('hidden');

    // Keyboard input
    document.addEventListener('keydown', (e) => {
        keys[e.key] = true;
    });

    document.addEventListener('keyup', (e) => {
        keys[e.key] = false;
    });

    // Game loop for movement
    function gameLoop() {
        if (!gameRunning) return;

        if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
            playerX = Math.max(15, playerX - moveSpeed);
        }
        if (keys['ArrowRight'] || keys['d'] || keys['D']) {
            playerX = Math.min(270, playerX + moveSpeed);
        }
        
        player.style.left = playerX + 'px';
        requestAnimationFrame(gameLoop);
    }

    // Button controls
    function moveLeft() {
        if (!gameRunning) return;
        playerX = Math.max(15, playerX - moveSpeed);
        player.style.left = playerX + 'px';
    }

    function moveRight() {
        if (!gameRunning) return;
        playerX = Math.min(270, playerX + moveSpeed);
        player.style.left = playerX + 'px';
    }

    // Start game
    function startGame() {
        score = 0;
        lives = 3;
        playerX = 154;
        gameRunning = true;

        scoreDisplay.textContent = '0';
        livesDisplay.textContent = '❤️❤️❤️';
        player.style.left = '154px';

        // Clear old items
        document.querySelectorAll('.item').forEach(el => el.remove());

        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        controlsDiv.classList.remove('hidden');

        // Start loops
        gameLoop();
        spawnItem();
    }

    // Spawn items
    function spawnItem() {
        if (!gameRunning) return;

        const isGood = Math.random() > 0.3;
        const list = isGood ? goodItems : badItems;
        const emoji = list[Math.floor(Math.random() * list.length)];
        const points = isGood ? (emoji === '💎' ? 25 : emoji === '🔮' ? 20 : 10) : -10;

        const item = document.createElement('div');
        item.className = 'item';
        item.textContent = emoji;
        item.dataset.points = points;
        item.style.left = Math.random() * 300 + 20 + 'px';
        
        const speed = 2.5 + Math.random() * 1.5;
        item.style.transition = `top ${speed}s linear`;
        
        gameContainer.appendChild(item);
        
        // Trigger animation
        setTimeout(() => item.style.top = '480px', 10);

        // Collision check & removal
        const checkInterval = setInterval(() => {
            if (!gameRunning || !item.parentNode) {
                clearInterval(checkInterval);
                return;
            }

            const itemRect = item.getBoundingClientRect();
            const playerRect = player.getBoundingClientRect();

            if (itemRect.bottom >= playerRect.top && 
                itemRect.top <= playerRect.bottom &&
                itemRect.right >= playerRect.left && 
                itemRect.left <= playerRect.right) {
                
                const pts = parseInt(item.dataset.points);
                score += pts;
                scoreDisplay.textContent = score;

                if (pts < 0) {
                    lives--;
                    updateLives();
                    if (lives <= 0) endGame();
                }

                item.remove();
                clearInterval(checkInterval);
            }

            // Item fell off screen
            if (itemRect.top > 480) {
                item.remove();
                clearInterval(checkInterval);
            }
        }, 30);

        // Next spawn
        const delay = Math.max(400, 1000 - score * 3);
        setTimeout(spawnItem, delay);
    }

    function updateLives() {
        livesDisplay.textContent = '❤️'.repeat(lives);
    }

    function endGame() {
        gameRunning = false;
        controlsDiv.classList.add('hidden');
        finalScoreDisplay.textContent = score;
        gameOverScreen.classList.remove('hidden');
    }
</script>

</body>
</html>
